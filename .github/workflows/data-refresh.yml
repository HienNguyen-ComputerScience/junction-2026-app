# Daily refresh of the THL Sotkanet snapshot in data/ (see data/README.md, "Data refresh").
# Rebuilds the snapshot and the insights, runs every check and the full verify, and when a
# figure changed opens (or updates) one PR from data-refresh/auto. It never pushes to main.
name: Data refresh

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily (06:17 Helsinki in winter)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: data-refresh/auto
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # engines.node
          cache: npm

      - run: npm ci

      - name: Refresh the snapshot (build, insights, checks)
        run: npm run data:refresh

      - name: Verify
        run: npm test && npm run brief:check && npm run typecheck && npm run lint && npm run build

      - name: Anything changed in data/?
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No figure changed: nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --porcelain -- data/
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the refresh PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          title="data: Sotkanet refresh ${today}"
          node scripts/data/diff-summary.mjs > "$RUNNER_TEMP/pr-body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -- data/
          git commit -m "$title"
          # The bot owns this branch and rebuilds it from the default branch every run.
          git push --force origin "$BRANCH"

          pr="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated PR #$pr"
          else
            gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
